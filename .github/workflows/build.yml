# 每次推送或提交 PR 时编译两个应用的 debug 版，确认代码能通过编译。
# 编译出的 APK 只用于检查，签名是临时的，不要拿来发布（发布请用你自己的签名编译 release 版）。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [projector-helper, phone-remote]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-debug
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
